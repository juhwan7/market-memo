name: Market Memo Web

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-site.txt"
      - "scripts/prepare_site.py"
      - "website/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-site.txt"
      - "scripts/prepare_site.py"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-memo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install site dependencies
        run: pip install -r requirements-site.txt

      - name: Prepare Markdown site tree
        run: python scripts/prepare_site.py

      - name: Build MkDocs site
        run: mkdocs build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site-output

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
