name: IPO 자동 감시

on:
  schedule:
    - cron: "30 0 * * 1-5" # 평일 09:30 KST
    - cron: "30 8 * * 1-5" # 평일 17:30 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ipo-auto-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 감시 의존성 설치
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pyyaml

      - name: IPO 상태 확인
        run: python 자동감시/ipo_watch.py

      - name: 변경 여부 확인
        id: changes
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 변경사항을 자동 PR로 생성
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="auto/ipo-status-update"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add 감시대상.yaml 자동감시 README.md 최근-업데이트.md 종목분석
          git commit -m "자동감시: IPO 상태 변경 감지"
          git push --force origin "$BRANCH"

          EXISTING_PR="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "[자동감시] IPO 상태 변경 감지" \
              --body $'KRX KIND 공식 자료에서 IPO 감시 대상의 상태 변화가 감지되어 자동으로 생성된 PR입니다.\n\n- main을 직접 수정하지 않습니다.\n- 기사만으로 상태를 바꾸지 않습니다.\n- 병합 전에 공식 원문과 변경 내용을 한 번 더 확인하세요.'
          else
            echo "기존 자동감시 PR #${EXISTING_PR} 브랜치를 최신 변경으로 갱신했습니다."
          fi
